[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[pypi-dependencies]
fetch_planning = { path = ".", editable = true }
foam = { path = "./third_party/foam", editable = true }

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
cricket-configure = "cmake -GNinja -S third_party/cricket -B third_party/cricket/build"
cricket-build = { cmd = "cmake --build third_party/cricket/build", depends-on = ["cricket-configure"] }
foam-configure = "cmake -GNinja -S third_party/foam -B third_party/foam/build"
foam-build = { cmd = "cmake --build third_party/foam/build", depends-on = ["foam-configure"] }
build-robot = { cmd = "bash scripts/build_robot.sh", depends-on = ["foam-build"] }
spherize-robot = { cmd = "bash scripts/spherize_robot.sh", depends-on = ["build-robot"] }
generate-fk = { cmd = "bash scripts/generate_fk.sh", depends-on = ["spherize-robot"] }
build-pkg = "python -m build --no-isolation --skip-dependency-check --outdir dist/"
render-docs-videos = "python scripts/render_videos/render_docs_videos.py"
test = "pytest tests/ -v"

[dependencies]
cmake = ">=4.4.3,<5"
ninja = ">=1.13.2,<2"
cxx-compiler = ">=2.0.0,<3"
pkg-config = ">=0.29.2,<0.30"
git = ">=2.55.0,<3"
patch = ">=2.8,<3"
python = ">=3.11,<3.13"
pybind11 = ">=3.1.0,<4"
libboost-devel = ">=1.90.0,<2"
orocos-kdl = ">=1.5.4,<2"
eigen = ">=5.0.1,<6"
nlopt = ">=2.11.0,<3"
pinocchio = ">=4.1.0,<5"
pink = ">=4.4.0,<5"
cppad = ">=20260000.0,<20260001"
cgal = ">=6.0.1,<7"
inja = ">=3.5.0,<4"
nlohmann_json = ">=3.12.0,<4"
fmt = ">=12.1.0,<13"
llvm = ">=23.1.2,<24"
fire = ">=0.7.1,<0.8"
xmltodict = ">=1.0.4,<2"
pymeshlab = ">=2025.7.post1,<2026"
pip = ">=26.2.1,<27"
python-build = ">=1.6.1,<2"
scikit-build-core = ">=1.1.0,<2"
nanobind = ">=3.1.0,<4"
twine = ">=7.0.0,<8"
pybullet = ">=3.25,<4"
pytest = ">=9.1.1,<10"

[feature.dev.pypi-dependencies]
pre-commit = ">=4.6.2, <5"
pybullet = "*"
